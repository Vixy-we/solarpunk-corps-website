    <!-- Fullscreen Lightbox Modal (Neobrutalist style) -->
    <div id="lightbox" class="fixed inset-0 z-[100] bg-[#f4f0eb]/95 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 bg-nb-red text-white w-12 h-12 flex items-center justify-center text-2xl font-black brutal-border shadow-brutal hover:translate-y-1 hover:shadow-brutal-sm focus:outline-none z-[101] brutal-card">
            X
        </button>
        <div class="max-w-5xl max-h-[90vh] p-4 relative w-full flex justify-center">
            <div class="bg-white p-4 brutal-border shadow-brutal">
                <img id="lightbox-img" src="" alt="Fullscreen view" class="max-w-full max-h-[75vh] object-contain border-4 border-[#111111]">
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Lightbox Logic
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(element) {
            const img = element.querySelector('img');
            if (img) {
                lightboxImg.src = img.src;
                lightbox.classList.remove('opacity-0', 'pointer-events-none');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeLightbox() {
            lightbox.classList.add('opacity-0', 'pointer-events-none');
            document.body.style.overflow = 'auto';
            setTimeout(() => {
                lightboxImg.src = '';
            }, 300);
        }

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !lightbox.classList.contains('pointer-events-none')) {
                closeLightbox();
            }
        });
    </script>
